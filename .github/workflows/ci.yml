name: CI

on:
  pull_request:
  push:
    branches: [main]

# D-13: Cancel in-progress runs for the same ref to avoid redundant work
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Lint — Biome check across all files
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: ./.github/actions/setup
      - run: pnpm lint

  # Job 1b: Migration Integrity (FND-15 hard gate)
  # Verifies that no committed migration SQL file has been edited since migration-hashes.json
  # was last generated. Exits 1 if any drift detected. Zero external dependencies — runs in
  # sub-second without a DB. Must run before integration tests.
  migration-integrity:
    name: Migration Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: ./.github/actions/setup
      - name: Check migration drift
        run: node scripts/check-migration-drift.mjs

  # Job 2: TypeCheck — tsc project references across all packages
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  # Job 3: Build — tsc build across all packages
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: ./.github/actions/setup
      - run: pnpm build

  # Job 4: Test — Node 22 + 24 matrix (fail-fast: false so both versions always run)
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24"]
      fail-fast: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      # secret-scan.test.ts asserts gitleaks is on PATH and runs detect fixtures (INF-06).
      # Install the same pinned version the Gitleaks history job uses (D-06).
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          sudo tar -xz -C /usr/local/bin gitleaks < /tmp/gitleaks.tar.gz
          rm /tmp/gitleaks.tar.gz
      - run: pnpm test
        env:
          DATABASE_URL: ""
          TESTCONTAINERS_RYUK_DISABLED: "true"

  # Job 5: Coverage Gate — single Node 22 (NOT a matrix job)
  # Rationale: Node version is orthogonal to v8 coverage provider behavior (v8 is a Node
  # built-in). Running coverage gate on Node 22 only is sufficient. The test matrix (Job 4)
  # already validates behavior on Node 22 and 24. Duplicating coverage on Node 24 would add
  # CI time without meaningful signal. Coverage gate remains on Node 22 (D-25, D-26).
  coverage-gate:
    name: Coverage Gate
    needs: [lint, typecheck, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: ./.github/actions/setup
      # secret-scan.test.ts (run as part of the coverage suite) asserts gitleaks on PATH (INF-06).
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          sudo tar -xz -C /usr/local/bin gitleaks < /tmp/gitleaks.tar.gz
          rm /tmp/gitleaks.tar.gz
      - name: Run tests with coverage
        run: pnpm vitest run --coverage
        env:
          DATABASE_URL: ""
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Report coverage on PR
        uses: davelosert/vitest-coverage-report-action@edb1ad1e6a02b1dd761ddd26739a396ee537c08e  # v2.7.0
        if: always()
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json
      - name: Upload lcov artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: coverage
          path: ./coverage/lcov.info
          # D-26: Only upload lcov.info — no dist/ or SBOM (those are Phase 9)

  # Job 6: Changeset Check — only on PRs (not on push to main per RESEARCH.md Pitfall 8)
  # pnpm changeset status --since=main exits 1 on main itself (no changesets "since main")
  changeset-check:
    name: Changeset Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      # In a PR checkout the base branch is not a local ref, so `--since=main`
      # fails with "Failed to find where HEAD diverged from main". Create the
      # local main ref from origin before running the gate. (Skip if HEAD is main.)
      - name: Ensure local main ref
        run: git fetch origin main:main || true
      - uses: ./.github/actions/setup
      - run: pnpm changeset status --since=main

  # Job 7: Integration Tests — testcontainers + full migration stack verification
  # Runs after lint, typecheck, and build pass. Docker daemon available on ubuntu-latest.
  # TESTCONTAINERS_RYUK_DISABLED=true avoids Ryuk container-cleanup daemon failures on GH runners.
  # This job is the Phase 2 gate: pnpm db:migrate end-to-end + all E2E migration assertions.
  #
  # Branch protection: add 'integration-test' to required status checks in GitHub UI
  # (Settings → Branches → Branch protection rules → Status checks).
  integration-test:
    name: Integration Tests (testcontainers)
    needs: [lint, typecheck, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: ./.github/actions/setup
      - name: Check migration drift (FND-15 hard gate)
        run: node scripts/check-migration-drift.mjs
      - name: Run integration tests (testcontainers)
        run: pnpm --filter @aprumo/core test --run
        env:
          # testcontainers manages its own container — no external DATABASE_URL needed
          DATABASE_URL: ""
          # Disable Ryuk cleanup daemon — can fail on GitHub-hosted runners
          TESTCONTAINERS_RYUK_DISABLED: "true"

  # Job 8: Gitleaks History — full git history scan with custom rules (D-06)
  # fetch-depth: 0 required to scan complete history (not just latest commit)
  # .gitleaks.toml applies custom starkbank-private-key rule (see RESEARCH.md Pattern 6)
  # For org repos: add GITLEAKS_LICENSE secret (free at gitleaks.io) per RESEARCH.md Pitfall 6
  gitleaks-history:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan full git history for secrets
        run: |
          # Use gitleaks CLI directly to apply custom .gitleaks.toml rules
          # (starkbank-private-key rule requires --config .gitleaks.toml)
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          sudo tar -xz -C /usr/local/bin gitleaks < /tmp/gitleaks.tar.gz
          rm /tmp/gitleaks.tar.gz
          gitleaks detect --config .gitleaks.toml --redact --no-banner
          # For org repos: add GITLEAKS_LICENSE secret (free at gitleaks.io) per RESEARCH.md Pitfall 6
