name: Release

on:
  push:
    branches: [main]

# D-23a: GitHub Actions OIDC side — id-token:write + provenance attestation. Delivered Phase 1.
# D-23b: npm Trusted Publisher config (per-package setup on npmjs.com) — deferred to Phase 9.
# Real npm publish triggered in Phase 9 when packages are ready for v0.1.0 release.

permissions:
  id-token: write    # OIDC for npm trusted publishing (D-23a)
  contents: write    # push version commits + tags
  pull-requests: write  # create "Version Packages" PR via changesets/action

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # fetch-depth: 0 ensures changesets/action can read git history for changelog

      - uses: ./.github/actions/setup

      - name: Build packages before publishing
        run: pnpm build

      - name: Create Version PR or Publish
        uses: changesets/action@v1
        with:
          # Creates "Version Packages" PR automatically when changesets are present.
          # The publish command only fires when the Version Packages PR is merged.
          # D-23b: npm Trusted Publisher config deferred to Phase 9 — no publish risk until then.
          publish: pnpm changeset publish
          title: "Version Packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN is intentionally absent — OIDC trusted publishing (D-23a) is used instead.
          # Phase 9 will configure Trusted Publisher entries on npmjs.com per package (D-23b).
          # For the first release: use a short-lived NPM_TOKEN until D-23b is configured.
