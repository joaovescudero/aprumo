name: Release

on:
  push:
    branches: [main]

# D-23-revised: publish @aprumo/* to GitHub Packages instead of npm for v0.1.
# GITHUB_TOKEN with packages:write permission authenticates publish.
# id-token:write retained so npm publish --provenance attests artifacts via GHP.
# Original D-23a (npm OIDC) and D-23b (npm Trusted Publisher) superseded by this decision.
# Migration to npm registry may be revisited in a future milestone.

permissions:
  id-token: write    # provenance attestation
  contents: write    # push version commits + tags
  pull-requests: write  # create "Version Packages" PR via changesets/action
  packages: write    # publish to GitHub Packages

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # fetch-depth: 0 ensures changesets/action can read git history for changelog

      - uses: ./.github/actions/setup

      # Configure GitHub Packages auth. registry-url + scope write the
      # //npm.pkg.github.com/:_authToken line into ~/.npmrc that npm publish reads.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: 'https://npm.pkg.github.com'
          scope: '@aprumo'

      - name: Build packages before publishing
        run: pnpm build

      - name: Create Version PR or Publish
        uses: changesets/action@v1
        with:
          # Creates "Version Packages" PR automatically when changesets are present.
          # The publish command only fires when the Version Packages PR is merged.
          # Each package.json sets publishConfig.registry → GitHub Packages.
          publish: pnpm changeset publish
          title: "Version Packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
