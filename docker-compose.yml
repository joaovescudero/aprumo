services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: aprumo_migration
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: aprumo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    command: >
      postgres
      -c autovacuum_naptime=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aprumo_migration -d aprumo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
